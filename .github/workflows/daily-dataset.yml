name: daily-synthetic-dataset

on:
  # Updating this workflow starts one run so the new preview is generated immediately.
  push:
    paths:
      - ".github/workflows/daily-dataset.yml"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      record_count:
        description: "Number of synthetic profile records"
        required: false
        default: "10000"
        type: string
      password_count:
        description: "Number of synthetic password samples"
        required: false
        default: "5000"
        type: string

permissions:
  contents: write

concurrency:
  group: daily-synthetic-dataset
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install LeakLab
        run: python -m pip install .

      - name: Generate daily synthetic datasets
        id: generate
        env:
          RECORD_COUNT: ${{ inputs.record_count || '10000' }}
          PASSWORD_COUNT: ${{ inputs.password_count || '5000' }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from leaklab.daily import build_daily_bundle

          today = datetime.now(timezone.utc).date()
          output = Path("data/daily-datasets") / today.isoformat()
          manifest = build_daily_bundle(
              today,
              output,
              record_count=int(os.environ["RECORD_COUNT"]),
              password_count=int(os.environ["PASSWORD_COUNT"]),
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"preview_path={output / 'README.md'}\n")
          PY

      - name: Show compact preview in the Actions run
        run: |
          {
            echo "## Daily dataset preview"
            echo
            cat "${{ steps.generate.outputs.preview_path }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit generated datasets to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-datasets/
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "chore(data): add synthetic dataset for $(date -u +%F)"
            git push
          fi
