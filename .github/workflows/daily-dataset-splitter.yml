name: daily-synthetic-dataset-splitter

on:
  schedule:
    - cron: "29 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-dataset-writes
  cancel-in-progress: false

jobs:
  split:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out generated dataset
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install LeakLab
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Split the latest daily dataset and preserve originals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from leaklab.split_daily import split_daily_bundle

          root = Path("data/daily-datasets")
          candidates = sorted(
              path for path in root.iterdir()
              if path.is_dir() and (path / "manifest.json").is_file()
          )
          if not candidates:
              raise SystemExit("No generated daily dataset was found.")

          target = candidates[-1]
          manifest_path = target / "manifest.json"
          current_manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if current_manifest.get("split_complete"):
              print(f"Latest dataset is already split: {target}")
              raise SystemExit(0)

          manifest = split_daily_bundle(target)
          print(json.dumps({
              "dataset": str(target),
              "split_complete": manifest["split_complete"],
              "records_chunks": len(manifest["records_files"]["jsonl"]),
              "password_chunks": len(manifest["password_sample_files"]["jsonl"]),
          }, indent=2))
          PY

      - name: Commit split files without deleting original exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-datasets/
          if git diff --cached --quiet; then
            echo "No split dataset changes to commit."
          else
            git commit -m "chore(data): add split exports for $(date -u +%F)"
            git push origin HEAD:main
          fi
